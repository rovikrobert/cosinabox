name: release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract tag version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches pyproject version
        run: |
          file_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$file_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag v${{ steps.version.outputs.version }} does not match pyproject version $file_version"
            exit 1
          fi
      - run: pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cosinabox/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    # Skip production PyPI for prereleases (rc, a, b in tag).
    if: ${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cosinabox/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  build-runtime-image:
    # Published as `ghcr.io/rovikrobert/cosinabox-runtime:{0.1,0.1.1,latest}`.
    # Bakes in Python 3.11 + the just-published cosinabox release with the
    # `[google]` extra. Users layer other extras on top with a cheap
    # `RUN pip install cosinabox[attio]` — base deps cache hits.
    needs: [build, publish-pypi]
    if: ${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # GHCR push
    steps:
      - uses: actions/checkout@v4
      - name: Derive tags from version
        id: tags
        run: |
          v="${{ needs.build.outputs.version }}"
          major_minor="${v%.*}"
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "minor=$major_minor" >> "$GITHUB_OUTPUT"
      - name: Wait for PyPI to expose the new release
        # Trusted Publishing returns 200 before every CDN edge has the
        # file. Scraping /simple/ hits a different edge than pip inside
        # docker buildx — scraping can succeed while pip still sees
        # stale data (this bit us on 0.1.3). Use `pip install --dry-run`
        # against a pinned version: that's the exact resolver path the
        # subsequent build will take, so consistency is guaranteed.
        # --no-deps skips the transitive fetch so this is fast.
        run: |
          python -m pip install --upgrade pip
          for i in $(seq 1 36); do
            if pip install --dry-run --no-deps \
                "cosinabox==${{ needs.build.outputs.version }}" \
                >/dev/null 2>&1; then
              echo "pip can resolve cosinabox ${{ needs.build.outputs.version }}"
              exit 0
            fi
            echo "waiting for pip resolver to see ${{ needs.build.outputs.version }} ($i/36)..."
            sleep 5
          done
          echo "timeout waiting for PyPI resolver — build would fail"
          exit 1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: docker/runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            COSINABOX_VERSION=${{ needs.build.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cosinabox-runtime:${{ steps.tags.outputs.full }}
            ghcr.io/${{ github.repository_owner }}/cosinabox-runtime:${{ steps.tags.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/cosinabox-runtime:latest
