name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,google]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/cosinabox
      - run: pytest -q
