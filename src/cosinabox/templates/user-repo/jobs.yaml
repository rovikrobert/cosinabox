schema_version: 1
jobs:
  morning_briefing:
    enabled: true
    schedule: "0 8 * * *"
    timezone: <YOUR_TIMEZONE>
  pre_meeting_prep:
    enabled: true
    minutes_before: 30
    skip_if_calendar_title_matches: ["focus block", "lunch"]
  evening_wrap:
    enabled: false
  weekly_review:
    enabled: false
  followup_reminder:
    enabled: false
  inbound_email_check:
    enabled: false
    schedule: "*/5 * * * *"   # every 5 minutes — alerts on urgent inbound email
  crm_email_sync:
    enabled: false
    schedule: "45 17 * * *"   # 5:45 PM — syncs sent email timestamps to CRM
