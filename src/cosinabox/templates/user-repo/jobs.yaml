schema_version: 1
jobs:
  morning_briefing:
    enabled: true
    schedule: "0 8 * * *"
    timezone: <YOUR_TIMEZONE>
  pre_meeting_prep:
    enabled: true
    minutes_before: 30
    skip_if_calendar_title_matches: ["focus block", "lunch"]
  evening_wrap:
    enabled: false
  weekly_review:
    enabled: false
  followup_reminder:
    enabled: false
  inbound_email_check:
    enabled: false
    schedule: "*/5 * * * *"   # every 5 minutes — alerts on urgent inbound email
  crm_email_sync:
    enabled: false
    schedule: "45 17 * * *"   # 5:45 PM — syncs sent email timestamps to CRM
  extract_fireflies:
    enabled: false
    schedule: "0 7 * * *"      # 7:00 AM — extract facts from meeting transcripts
  extract_gmail:
    enabled: false
    schedule: "15 7 * * *"     # 7:15 AM — extract facts from stakeholder emails
  post_meeting_debrief:
    enabled: false               # sends summary after meetings end
  rela_daily_scan:
    enabled: false
    schedule: "50 7 * * *"     # 7:50 AM — check relationship health
