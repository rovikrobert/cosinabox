repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pin matches the ruff version CI installs (via pyproject dev deps).
    # Version skew caused formatting churn: v0.4 would reformat files that
    # v0.15 considered clean, and CI would fail on those files.
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: secret-scan
        name: secret-scan
        # The hook's own regex contains the sentinel prefixes (sk-ant-,
        # xoxb-, etc.), so greping staged files self-matches whenever
        # one of those literals appears in source. Exclude:
        #   - this config (regex source-of-truth)
        #   - src/cosinabox/doctor/checks.py: SecretInTrackedFileCheck's
        #     own _SECRET_PATTERNS contains the literals by design;
        #     SecretInTrackedFileCheck is what guards user repos against
        #     real secret leaks.
        # Both are maintainer-only files; neither carries user content.
        #
        # Implementation note: capture grep's filename output instead of
        # relying on the pipeline exit code. macOS BSD xargs exits 0 on
        # empty input (no-run-if-empty by default), which previously
        # tripped `&& exit 1` whenever every staged file was excluded.
        entry: bash -c 'matches=$(git diff --cached --name-only -z | grep -vzE "^(\.pre-commit-config\.yaml|src/cosinabox/doctor/checks\.py)$" | xargs -0 -r grep -lE "(sk-ant-|xoxb-|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{36})"); if [ -n "$matches" ]; then echo "Secret pattern found in:"; echo "$matches"; exit 1; fi; exit 0'
        language: system
        pass_filenames: false
        stages: [pre-commit]
