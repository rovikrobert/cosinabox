[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosinabox"
version = "0.1.5"
description = "Open-source Chief of Staff in a box. Opinionated, proactive, runs on your own infra."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Cantina" }]
keywords = ["chief-of-staff", "agent", "anthropic", "claude", "telegram", "productivity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anthropic>=0.40",
  "python-telegram-bot>=21.0",
  "apscheduler>=3.10",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "click>=8.1",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
google = [
  "google-api-python-client>=2.120",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
]
fireflies = ["httpx>=0.27"]
search = ["httpx>=0.27"]
attio = ["httpx>=0.27"]
# MCP consult endpoint (cosinabox consult-serve). Optional per CLAUDE.md rule 5:
# not every deployment exposes a consult server, so the `mcp` Python SDK stays
# out of the core install. `pip install cosinabox[consult]` pulls it in.
# Minimum pinned to 1.12 because that's the oldest version where the FastMCP
# surface + run(transport=...) + TokenVerifier auth are jointly documented
# (see "M1 SDK vetting log" appendix in docs/plans/2026-04-20-port-consult-mcp.md).
consult = ["mcp>=1.12"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
  "types-jsonschema",
  # CI runs consult tests, so pull in the consult extra. Keep in sync with
  # the `consult` group above.
  "mcp>=1.12",
]

[project.urls]
Homepage = "https://github.com/rovikrobert/cosinabox"
Source = "https://github.com/rovikrobert/cosinabox"
Issues = "https://github.com/rovikrobert/cosinabox/issues"
Changelog = "https://github.com/rovikrobert/cosinabox/blob/main/CHANGELOG.md"

[project.scripts]
cosinabox = "cosinabox.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/cosinabox"]

[tool.hatch.build.targets.wheel.force-include]
"src/cosinabox/personas/founder.md" = "cosinabox/personas/founder.md"
"src/cosinabox/schemas/personality.schema.json" = "cosinabox/schemas/personality.schema.json"
"src/cosinabox/schemas/stakeholders.schema.json" = "cosinabox/schemas/stakeholders.schema.json"
"src/cosinabox/schemas/jobs.schema.json" = "cosinabox/schemas/jobs.schema.json"
"src/cosinabox/schemas/integrations.schema.json" = "cosinabox/schemas/integrations.schema.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["apscheduler.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
